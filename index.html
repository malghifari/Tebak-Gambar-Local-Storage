<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tebak Gambar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- START SCREEN -->
<div id="startScreen" class="overlay">

  <div class="start-wrapper text-center">

    <!-- CARD -->
    <div class="start-card">

      <h2 class="mb-3">🎮 Tebak Gambar</h2>

      <!-- Input Nama -->
      <input id="playerName" class="form-control mb-3" placeholder="Masukkan nama pemain">

      <!-- Mode Game -->
      <select id="modeGame" class="form-select mb-3">
        <option value="pilihan">🎯 Pilihan Ganda</option>
        <option value="ketik">⌨️ Ketik Jawaban</option>
      </select>

      <!-- Kategori -->
      <select id="kategoriGame" class="form-select mb-3">
        <option value="semua">🌐 Semua (Campuran)</option>
        <option value="isim">🐾 Isim</option>
        <option value="fiil">🍎 Fi'il</option>
      </select>

      <!-- Start Button -->
      <button id="btnStartGame" class="btn btn-primary w-100 mb-2">
        Mulai Game
      </button>

      <!-- ADMIN BUTTON -->
      <button id="btnAdmin" class="btn btn-dark w-100">
        🛠️ Admin Panel
      </button>

      <!-- Toggle Sound -->
      <div class="form-check form-switch mt-2 text-start">
        <input class="form-check-input" type="checkbox" id="toggleSound" checked>
        <label class="form-check-label">Sound ON</label>
      </div>

    </div>

  </div>

</div>

<!-- GAME -->
<div class="container">
  <div class="card p-3 text-center game-card">

    <!-- Top HUD -->
    <div class="d-flex justify-content-between align-items-center mb-2 small">
      <div>👤 <strong id="namaPemain">-</strong></div>
      <div>❤️ <span id="lives">3</span></div>
      <div>⏱️ <span id="timer">15</span>s</div>
      <div>🏆 <span id="skor">0</span></div>
      <p id="comboText" class="fw-bold text-warning"></p>
      <div>📂 <span id="kategoriText">Semua</span></div>
    </div>

    <!-- Progress -->
    <div class="progress mb-3">
      <div id="progressBar" class="progress-bar"></div>
    </div>

    <!-- Image -->
    <div class="image-wrap mb-2">
      <img id="gambar" class="gambar" alt="soal">
    </div>

    <!-- Hint -->
    <p id="hint" class="text-muted small mb-2"></p>

    <!-- Input -->
    <input id="jawaban" class="form-control mb-2" placeholder="Ketik jawaban...">
    <!-- PILIHAN GANDA -->
    <div id="opsiContainer" class="d-grid gap-2 mt-2"></div>

    <!-- Buttons -->
    <div class="d-grid gap-2">
      <button id="btnJawab" class="btn btn-primary"><i class="bi bi-check2-circle"></i> Jawab</button>
      <button id="btnHint" class="btn btn-warning"><i class="bi bi-lightbulb"></i> Hint</button>
      <button id="btnPause" class="btn btn-dark"><i class="bi bi-pause"></i> Pause</button>
    </div>

    <!-- Result -->
    <p id="hasil" class="mt-2 mb-1"></p>

    <!-- High Score -->
    <small class="text-muted">High Score: <span id="highScore">0</span></small>
  </div>
</div>

<!-- PAUSE -->
<div id="pauseScreen" class="overlay d-none">
  <div class="overlay-content text-center">
    <h3>⏸️ Dijeda</h3>
    <button id="btnResume" class="btn btn-success w-100 mt-2">▶️ Lanjutkan</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameOverScreen" class="overlay d-none">
  <div class="overlay-content text-center">
    <h2 id="endTitle">Game Selesai</h2>
    <p>Skor</p>
    <h1 id="finalScore">0</h1>
    <p>High Score: <span id="finalHighScore">0</span></p>

    <div class="d-grid gap-2 mt-3">
      <button id="btnMainLagi" class="btn btn-primary">Main Lagi</button>
      <button id="btnLeaderboard" class="btn btn-outline-light w-100 mt-2">
        📊 Lihat Leaderboard
      </button>
      <button onclick="location.reload()" class="btn btn-outline-light textHitam">Keluar</button>
    </div>
  </div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboardScreen" class="overlay d-none">
  <div class="overlay-content">

    <h3 class="text-center mb-3">🏆 Leaderboard</h3>

    <ul id="leaderboardList" class="list-group mb-3"></ul>

    <div class="d-grid gap-2">
      <button id="btnResetLeaderboard" class="btn btn-danger">
        🗑️ Reset Leaderboard
      </button>
      <button id="btnCloseLeaderboard" class="btn btn-secondary">
        Tutup
      </button>
    </div>

  </div>
</div>

<!-- SOUND -->
<audio id="soundBenar" src="https://audio-previews.elements.envatousercontent.com/files/500391660/preview.mp3"></audio>
<audio id="soundSalah" src="https://audio-previews.elements.envatousercontent.com/files/807021803/preview.mp3"></audio>
<audio id="soundGameOver" src="https://audio-previews.elements.envatousercontent.com/files/639061810/preview.mp3"></audio>
<audio id="soundClick" src="https://assets.mixkit.co/sfx/preview/mixkit-select-click-1109.mp3"></audio>
<audio id="soundCombo" src="https://audio-previews.elements.envatousercontent.com/files/227200069/preview.mp3"></audio>

<!-- jQuery + confetti -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<!-- ADMIN LOGIN -->
<div id="adminLogin" class="overlay d-none">
  <div class="overlay-content text-center">

    <h3 class="mb-3">🔐 Login Admin</h3>

    <input
      type="password"
      id="adminPassword"
      class="form-control mb-3"
      placeholder="Masukkan password"
    >

    <div class="d-grid gap-2">
      <button id="btnMasukAdmin" class="btn btn-success">
        Masuk
      </button>

      <button id="btnCloseAdmin" class="btn btn-secondary">
        Batal
      </button>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
