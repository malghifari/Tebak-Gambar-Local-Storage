<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel - Tebak Gambar</title>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-4">

  <div class="card p-4">

    <h2 class="mb-4 text-center">🛠️ Admin Panel</h2>

    <!-- FORM -->
    <div class="mb-3">
      <label>URL Gambar</label>
      <input type="text" id="gambar" class="form-control">
    </div>

    <div class="mb-3">
      <label>Jawaban</label>
      <input type="text" id="jawaban" class="form-control">
    </div>

    <div class="mb-3">
      <label>Kategori</label>

      <select id="kategori" class="form-select">
        <option value="isim">Isim</option>
        <option value="fiil">Fi'il</option>
      </select>
    </div>

    <button id="btnTambah" class="btn btn-primary w-100">
      ➕ Tambah Soal
    </button>

    <hr>

    <!-- LIST -->
    <h4>📋 Daftar Soal</h4>

    <div id="listSoal"></div>

    <hr>

    <button id="btnExport" class="btn btn-success w-100 mb-2">
      📤 Export JSON
    </button>

    <button id="btnReset" class="btn btn-danger w-100">
      🗑️ Reset Semua
    </button>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="admin.js"></script>

</body>
</html>
